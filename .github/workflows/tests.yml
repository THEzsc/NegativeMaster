name: Python and browser regressions
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: '1'
      - run: node --test tests/test_local_paths.cjs tests/test_sheet_model.cjs tests/test_sheet_workflow.cjs tests/test_workflow_model.cjs tests/test_workflow_saving.cjs tests/test_artwork_model.cjs tests/test_archive_artwork.cjs
